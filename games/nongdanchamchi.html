<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Game: Hái táo 1→10 (có giỏ)</title>
<style>
  :root {
    --bg: #dff1ff;
    --tree-brown: #6b3f1f;
    --leaf: #2f8b3a;
    --apple: #d32f2f;
  }
  
  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  
  .game-container {
    width: 900px;
    max-width: 95vw;
    height: 600px;
    max-height: 85vh;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    position: relative;
    overflow: hidden;
  }
  
  .background {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }
  
  .game {
    position: relative;
    width: 100%;
    height: 100%;
    z-index: 2;
  }

  /* HUD */
  .hud {
    display: flex;
    gap: 12px;
    align-items: center;
    position: absolute;
    left: 12px;
    top: 12px;
    z-index: 40;
  }
  
  .hint {
    background: rgba(255, 255, 255, 0.8);
    padding: 8px 12px;
    border-radius: 10px;
    font-weight: 600;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
  
  button {
    background: #fff;
    border: 0;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    transition: all 0.2s;
  }
  
  button:hover {
    background: #f0f0f0;
    transform: translateY(-2px);
  }

  /* apple tree */
  .apple-tree {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 500px;
    height: 400px;
    z-index: 5;
  }
  
  .apple-tree img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.2));
  }
  
  .apples {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 500px;
    height: 400px;
    z-index: 20;
  }

  /* apple */
  .apple {
    --size: 64px;
    width: var(--size);
    height: var(--size);
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: transform 0.3s;
    z-index: 25;
  }
  
  .apple img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.2));
  }
  
  .apple .number {
    position: absolute;
    color: white;
    font-weight: 700;
    font-size: 20px;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
  }
  
  .apple:hover {
    transform: scale(1.1);
  }

  /* basket */
  .basket {
    position: absolute;
    right: 20px;
    bottom: 20px;
    width: 120px;
    height: 100px;
    z-index: 30;
    text-align: center;
    font-weight: 700;
    color: #fff;
  }
  
  .basket img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
  }

  /* Menus */
  .menu {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.7);
    color: #fff;
    z-index: 100;
    transition: opacity 0.5s;
  }
  
  .menu.hidden {
    opacity: 0;
    pointer-events: none;
  }
  
  .menu-content {
    background: rgba(255, 255, 255, 0.9);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    max-width: 80%;
    color: #333;
  }
  
  .menu h2 {
    font-size: 32px;
    margin-bottom: 20px;
    color: #2f8b3a;
  }
  
  .menu p {
    font-size: 18px;
    margin-bottom: 25px;
    line-height: 1.5;
  }
  
  .menu-btn {
    background: #4CAF50;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
  
  .menu-btn:hover {
    background: #3e8e41;
    transform: translateY(-3px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.3);
  }
  
  .win-message {
    font-size: 28px;
    color: #4CAF50;
    margin-bottom: 20px;
    font-weight: bold;
  }
  
  .confetti {
    position: absolute;
    width: 15px;
    height: 15px;
    background: #f0f;
    opacity: 0.8;
    border-radius: 0;
    z-index: 99;
  }
  
  @keyframes fall {
    from { transform: translateY(-100px) rotate(0deg); }
    to { transform: translateY(600px) rotate(360deg); }
  }
</style>
</head>
<body>
<div class="game-container">
  <img src="background.png" class="background" alt="Nền game">
  
  <div class="game">
    <!-- Menu bắt đầu -->
    <div class="menu" id="startMenu">
      <div class="menu-content">
        <h2>Game Hái Táo</h2>
        <p>Hãy hái những quả táo theo thứ tự từ 1 đến 10!<br>Nhấn nút bên dưới để bắt đầu.</p>
        <button class="menu-btn" id="startBtn">Bắt đầu</button>
      </div>
    </div>

    <!-- Menu kết thúc -->
    <div class="menu hidden" id="endMenu">
      <div class="menu-content">
        <h2>Chúc mừng!</h2>
        <p class="win-message">Bạn đã hái đủ 10 quả táo!</p>
        <p>Bạn có muốn chơi lại không?</p>
        <button class="menu-btn" id="playAgainBtn">Chơi lại</button>
      </div>
    </div>

    <div class="hud">
      <div class="hint">Hái táo theo thứ tự: <span id="target">1</span> → 10</div>
      <button id="restartBtn">Làm lại</button>
    </div>
    
    <div class="apple-tree">
      <img src="apple_tree.png" alt="Cây táo">
    </div>
    
    <div class="apples" id="apples"></div>
    
    <div class="basket" id="basket">
      <img src="basket.png" alt="Giỏ đựng táo">
    </div>
  </div>
</div>

<script>
// Lấy các phần tử DOM
const applesEl = document.getElementById("apples");
const targetEl = document.getElementById("target");
const basketEl = document.getElementById("basket");
const restartBtn = document.getElementById("restartBtn");
const startMenu = document.getElementById("startMenu");
const endMenu = document.getElementById("endMenu");
const startBtn = document.getElementById("startBtn");
const playAgainBtn = document.getElementById("playAgainBtn");

// Biến toàn cục
let target = 1, N = 10;
let appleImages = []; // Lưu trữ các đối tượng ảnh táo

// Hàm tạo số ngẫu nhiên
function rand(min, max) {
  return Math.random() * (max - min) + min;
}

// Tạo hiệu ứng confetti
function createConfetti() {
  const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
  for (let i = 0; i < 50; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = rand(0, 100) + '%';
    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.animation = `fall ${rand(2, 5)}s linear forwards`;
    document.querySelector('.game-container').appendChild(confetti);
    
    // Xóa confetti sau khi rơi xong
    setTimeout(() => {
      confetti.remove();
    }, 5000);
  }
}

// Tạo quả táo
function createApple(num) {
  const el = document.createElement("div");
  el.className = "apple";
  el.dataset.num = num;
  
  // Tạo ảnh táo
  const img = document.createElement("img");
  img.src = "apple.png";
  img.alt = `Táo số ${num}`;
  
  // Tạo số trên táo
  const number = document.createElement("div");
  number.className = "number";
  number.textContent = num;
  
  el.appendChild(img);
  el.appendChild(number);
  
  // Đặt vị trí ngẫu nhiên trên cây
  el.style.left = rand(50, 400) + "px";
  el.style.top = rand(30, 300) + "px";
  
  // Thêm sự kiện click
  el.addEventListener("click", () => onClickApple(el, num));
  
  return el;
}

// Xử lý khi click vào táo
function onClickApple(el, num) {
  if (num !== target) { // sai
    el.style.transform = "scale(1.2) rotate(10deg)";
    setTimeout(() => el.style.transform = "scale(1)", 300);
    return;
  }
  
  // đúng → bay về giỏ
  const basketRect = basketEl.getBoundingClientRect();
  const appleRect = el.getBoundingClientRect();
  const dx = basketRect.left + basketRect.width/2 - (appleRect.left + appleRect.width/2);
  const dy = basketRect.top + basketRect.height/2 - (appleRect.top + appleRect.height/2);

  el.style.transition = "transform 1.5s, opacity 1.2s";
  el.style.transform = `translate(${dx}px, ${dy}px) scale(0.3)`;
  el.style.opacity = "0";
  el.style.pointerEvents = "none";

  target++;
  targetEl.textContent = target <= N ? target : "✓";

  if (target > N) {
    setTimeout(() => {
      endMenu.classList.remove("hidden");
      createConfetti();
    }, 1000);
  }
}

// Bắt đầu game
function startGame() {
  startMenu.classList.add("hidden");
  endMenu.classList.add("hidden");
  applesEl.innerHTML = "";
  target = 1;
  targetEl.textContent = "1";
  
  for (let i = 1; i <= N; i++) {
    applesEl.appendChild(createApple(i));
  }
}

// Thiết lập sự kiện
restartBtn.onclick = startGame;
startBtn.onclick = startGame;
playAgainBtn.onclick = startGame;

// Tải trước ảnh để tránh nhấp nháy khi hiển thị
function preloadImages() {
  const imageSources = ["apple.png", "basket.png", "background.png", "apple_tree.png"];
  
  imageSources.forEach(src => {
    const img = new Image();
    img.src = src;
  });
}

// Khởi tạo
preloadImages();
</script>
</body>
</html>
