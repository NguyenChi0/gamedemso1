<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bãi Đỗ Xe 3D</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&display=swap');
    
    * {
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
    }
    
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #87CEEB 0%, #98FB98 50%, #90EE90 100%);
      color: #333;
      overflow: hidden;
    }
    
    .hud {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      padding: 15px 25px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }
    
    .hud h1 {
      margin: 0;
      font-size: 24px;
      color: #2c3e50;
      font-weight: 700;
    }
    
    .stats {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    
    .stat {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
    }
    
    .controls {
      display: flex;
      gap: 10px;
    }
    
    .btn {
      background: linear-gradient(135deg, #4CAF50, #45a049);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    
    .btn.secondary {
      background: linear-gradient(135deg, #2196F3, #1976D2);
    }
    
    .parking-lot {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: 
        radial-gradient(circle at 30% 70%, rgba(255,255,255,0.1) 0%, transparent 50%),
        linear-gradient(180deg, #87CEEB 0%, #98FB98 100%);
      perspective: 1000px;
      overflow: hidden;
    }
    
    .ground {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotateX(75deg);
      width: 1200px;
      height: 800px;
      background: 
        repeating-linear-gradient(
          90deg,
          #666 0px, #666 2px,
          transparent 2px, transparent 50px
        ),
        repeating-linear-gradient(
          0deg,
          #666 0px, #666 2px,
          transparent 2px, transparent 50px
        ),
        linear-gradient(135deg, #34495e, #2c3e50);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    
    .parking-spaces {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotateX(75deg);
      width: 1000px;
      height: 200px;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 10px;
      z-index: 10;
    }
    
    .parking-space {
      background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(240,240,240,0.8));
      border: 3px solid #3498db;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
      position: relative;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .parking-space::before {
      content: attr(data-number);
      position: absolute;
      top: -8px;
      background: #3498db;
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
    }
    
    .parking-space.filled {
      background: linear-gradient(135deg, rgba(46,204,113,0.3), rgba(39,174,96,0.3));
      border-color: #27ae60;
      box-shadow: 
        inset 0 2px 5px rgba(0,0,0,0.1),
        0 0 20px rgba(46,204,113,0.3);
    }
    
    .car {
      position: absolute;
      width: 80px;
      height: 40px;
      cursor: pointer;
      user-select: none;
      transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      z-index: 100;
      transform-style: preserve-3d;
    }
    
    .car-body {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 20px 20px 8px 8px;
      box-shadow: 
        0 4px 8px rgba(0,0,0,0.3),
        inset 0 2px 4px rgba(255,255,255,0.3);
      transition: all 0.3s ease;
      background: linear-gradient(135deg, var(--car-color), var(--car-color-dark));
    }
    
    .car:hover .car-body {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 
        0 8px 16px rgba(0,0,0,0.4),
        inset 0 2px 4px rgba(255,255,255,0.4);
    }
    
    .car-windows {
      position: absolute;
      top: 3px;
      left: 8px;
      right: 8px;
      height: 18px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      border-radius: 12px 12px 4px 4px;
      opacity: 0.8;
    }
    
    .car-windshield {
      position: absolute;
      top: 1px;
      left: 2px;
      right: 2px;
      height: 8px;
      background: linear-gradient(135deg, #74b9ff, #0984e3);
      border-radius: 8px 8px 0 0;
      opacity: 0.9;
    }
    
    .car-wheels {
      position: absolute;
      bottom: -3px;
      width: 100%;
      height: 6px;
    }
    
    .car-wheel {
      position: absolute;
      width: 12px;
      height: 8px;
      background: radial-gradient(circle, #2d3436, #636e72);
      border-radius: 50%;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
    }
    
    .car-wheel.front { left: 8px; }
    .car-wheel.rear { right: 8px; }
    
    .car-number {
      position: absolute;
      bottom: -25px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: #2c3e50;
      padding: 4px 8px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 12px;
      border: 2px solid #3498db;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    
    /* Car color variations */
    .car-1 { --car-color: #e74c3c; --car-color-dark: #c0392b; }
    .car-2 { --car-color: #3498db; --car-color-dark: #2980b9; }
    .car-3 { --car-color: #f39c12; --car-color-dark: #e67e22; }
    .car-4 { --car-color: #2ecc71; --car-color-dark: #27ae60; }
    .car-5 { --car-color: #9b59b6; --car-color-dark: #8e44ad; }
    .car-6 { --car-color: #1abc9c; --car-color-dark: #16a085; }
    .car-7 { --car-color: #e67e22; --car-color-dark: #d35400; }
    .car-8 { --car-color: #34495e; --car-color-dark: #2c3e50; }
    .car-9 { --car-color: #f1c40f; --car-color-dark: #f39c12; }
    .car-10 { --car-color: #e91e63; --car-color-dark: #ad1457; }
    
    /* Car colors for mini cars in parking spaces */
    :root {
      --car-color-1: linear-gradient(135deg, #e74c3c, #c0392b);
      --car-color-2: linear-gradient(135deg, #3498db, #2980b9);
      --car-color-3: linear-gradient(135deg, #f39c12, #e67e22);
      --car-color-4: linear-gradient(135deg, #2ecc71, #27ae60);
      --car-color-5: linear-gradient(135deg, #9b59b6, #8e44ad);
      --car-color-6: linear-gradient(135deg, #1abc9c, #16a085);
      --car-color-7: linear-gradient(135deg, #e67e22, #d35400);
      --car-color-8: linear-gradient(135deg, #34495e, #2c3e50);
      --car-color-9: linear-gradient(135deg, #f1c40f, #f39c12);
      --car-color-10: linear-gradient(135deg, #e91e63, #ad1457);
    }
    
    .car.next-target .car-body {
      animation: glow 2s infinite;
    }
    
    @keyframes glow {
      0%, 100% { 
        box-shadow: 
          0 4px 8px rgba(0,0,0,0.3),
          inset 0 2px 4px rgba(255,255,255,0.3),
          0 0 0 rgba(255,255,255,0.7);
      }
      50% { 
        box-shadow: 
          0 4px 8px rgba(0,0,0,0.3),
          inset 0 2px 4px rgba(255,255,255,0.3),
          0 0 20px rgba(255,255,255,0.8);
      }
    }
    
    .car.wrong {
      animation: shake 0.5s ease-in-out;
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-8px) rotate(-2deg); }
      50% { transform: translateX(8px) rotate(2deg); }
      75% { transform: translateX(-6px) rotate(-1deg); }
    }
    
    .car.parked {
      pointer-events: none;
      z-index: 50;
    }
    
    .success-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      z-index: 2000;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0);
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    
    .success-modal.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    
    .buildings {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40%;
      background: 
        linear-gradient(to bottom, 
          transparent 0%, 
          rgba(52, 73, 94, 0.1) 60%,
          rgba(52, 73, 94, 0.3) 100%
        );
      z-index: -1;
    }
    
    .building {
      position: absolute;
      bottom: 0;
      background: linear-gradient(135deg, #34495e, #2c3e50);
      border-radius: 5px 5px 0 0;
    }
    
    .building:nth-child(1) { left: 5%; width: 80px; height: 120px; }
    .building:nth-child(2) { left: 15%; width: 60px; height: 90px; }
    .building:nth-child(3) { left: 25%; width: 100px; height: 150px; }
    .building:nth-child(4) { right: 20%; width: 70px; height: 110px; }
    .building:nth-child(5) { right: 10%; width: 90px; height: 130px; }
    .building:nth-child(6) { right: 2%; width: 60px; height: 80px; }
    
    .clouds {
      position: absolute;
      top: 10%;
      width: 100%;
      height: 30%;
      overflow: hidden;
      z-index: -2;
    }
    
    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.8);
      border-radius: 50px;
      animation: float 20s infinite linear;
    }
    
    .cloud:before {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.8);
      border-radius: 50px;
    }
    
    .cloud:nth-child(1) {
      width: 60px; height: 20px;
      top: 20%; left: -60px;
      animation-delay: -5s;
    }
    .cloud:nth-child(1):before { width: 40px; height: 40px; top: -15px; left: 10px; }
    
    .cloud:nth-child(2) {
      width: 80px; height: 30px;
      top: 10%; left: -80px;
      animation-delay: -10s;
    }
    .cloud:nth-child(2):before { width: 60px; height: 60px; top: -25px; left: 15px; }
    
    .cloud:nth-child(3) {
      width: 100px; height: 25px;
      top: 30%; left: -100px;
      animation-delay: -15s;
    }
    .cloud:nth-child(3):before { width: 50px; height: 50px; top: -20px; left: 25px; }
    
    @keyframes float {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(calc(100vw + 100px)); }
    }
    
    .instructions {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 14px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="hud">
    <h1>🏢 Bãi Đỗ Xe 3D</h1>
    <div class="stats">
      <div class="stat">🎯 Xe: <span id="target">1</span></div>
      <div class="stat">⏱️ <span id="timer">0.000</span>s</div>
      <div class="stat">❌ <span id="mistakes">0</span></div>
    </div>
    <div class="controls">
      <button class="btn" id="btnRestart">🔄 Chơi lại</button>
      <button class="btn secondary" id="btnShuffle">🔀 Xáo trộn</button>
    </div>
  </div>

  <div class="parking-lot">
    <!-- Clouds -->
    <div class="clouds">
      <div class="cloud"></div>
      <div class="cloud"></div>
      <div class="cloud"></div>
    </div>
    
    <!-- Buildings -->
    <div class="buildings">
      <div class="building"></div>
      <div class="building"></div>
      <div class="building"></div>
      <div class="building"></div>
      <div class="building"></div>
      <div class="building"></div>
    </div>
    
    <!-- Ground -->
    <div class="ground"></div>
    
    <!-- Parking spaces -->
    <div class="parking-spaces" id="parkingSpaces"></div>
  </div>

  <div class="instructions">
    🚗 Đỗ xe theo thứ tự 1→10 | Phím: 1-9, 0 (xe 10) | Click chuột hoặc chạm màn hình
  </div>

  <div class="success-modal" id="successModal">
    🎉 Tuyệt vời! Tất cả xe đã vào bãi!
  </div>

<script>
(function(){
  const parkingLot = document.querySelector('.parking-lot');
  const parkingSpaces = document.getElementById('parkingSpaces');
  const targetEl = document.getElementById('target');
  const timerEl = document.getElementById('timer');
  const mistakesEl = document.getElementById('mistakes');
  const btnRestart = document.getElementById('btnRestart');
  const btnShuffle = document.getElementById('btnShuffle');
  const successModal = document.getElementById('successModal');

  let target = 1;
  let mistakes = 0;
  let startTime = null;
  let timerId = null;
  let cars = [];
  let spaces = [];

  function rand(min, max){ return Math.floor(Math.random()*(max-min+1))+min }

  function createParkingSpaces(){
    parkingSpaces.innerHTML = '';
    spaces = [];
    for(let i = 1; i <= 10; i++){
      const space = document.createElement('div');
      space.className = 'parking-space';
      space.dataset.number = i;
      parkingSpaces.appendChild(space);
      spaces.push(space);
    }
  }

  function createCars(){
    // Remove existing cars
    document.querySelectorAll('.car').forEach(car => car.remove());
    cars = [];
    
    const lotRect = parkingLot.getBoundingClientRect();
    const used = [];
    
    for(let i = 1; i <= 10; i++){
      const car = document.createElement('div');
      car.className = `car car-${i}`;
      car.dataset.num = i;
      
      car.innerHTML = `
        <div class="car-body">
          <div class="car-windows">
            <div class="car-windshield"></div>
          </div>
          <div class="car-wheels">
            <div class="car-wheel front"></div>
            <div class="car-wheel rear"></div>
          </div>
        </div>
        <div class="car-number">${i}</div>
      `;
      
      // Position randomly but avoid parking area
      let x, y, attempts = 0;
      const carWidth = 80, carHeight = 40;
      
      do {
        x = rand(50, window.innerWidth - carWidth - 50);
        y = rand(100, window.innerHeight - 300); // Avoid parking area
        attempts++;
        
        // Check collision with other cars
        const collision = used.some(pos => 
          Math.abs(x - pos.x) < carWidth + 20 && 
          Math.abs(y - pos.y) < carHeight + 20
        );
        
        if(!collision) break;
      } while(attempts < 50);
      
      used.push({x, y});
      car.style.left = x + 'px';
      car.style.top = y + 'px';
      
      car.addEventListener('click', onCarClick);
      car.addEventListener('touchstart', onCarClick, {passive: true});
      
      parkingLot.appendChild(car);
      cars.push(car);
    }
    
    updateNextTarget();
  }

  function updateNextTarget(){
    cars.forEach(car => car.classList.remove('next-target'));
    if(target <= 10){
      const nextCar = cars.find(car => 
        Number(car.dataset.num) === target && 
        !car.classList.contains('parked')
      );
      if(nextCar) nextCar.classList.add('next-target');
    }
  }

  function onCarClick(e){
    const car = e.currentTarget;
    const num = Number(car.dataset.num);
    
    if(target === 1 && startTime === null){
      startTime = performance.now();
      startTimer();
    }
    
    if(num === target){
      // Get parking space position
      const space = spaces[num - 1];
      const spaceRect = space.getBoundingClientRect();
      const lotRect = parkingLot.getBoundingClientRect();
      
      const targetX = spaceRect.left - lotRect.left + (spaceRect.width - 80) / 2;
      const targetY = spaceRect.top - lotRect.top + (spaceRect.height - 40) / 2;
      
      // Animate car to parking space
      car.style.left = targetX + 'px';
      car.style.top = targetY + 'px';
      car.style.transform = 'scale(0.9)';
      
      setTimeout(() => {
        car.classList.add('parked');
        space.classList.add('filled');
        space.innerHTML = `<div style="font-size: 12px; color: #27ae60;">Xe ${num}</div>`;
      }, 600);

      target++;
      targetEl.textContent = target <= 10 ? target : '✅';
      updateNextTarget();
      
      if(target > 10){
        stopTimer();
        const total = ((performance.now() - startTime)/1000).toFixed(3);
        setTimeout(() => {
          successModal.innerHTML = `
            🎉 Xuất sắc!<br>
            ⏱️ Hoàn thành trong: ${total}s<br>
            ❌ Số lần sai: ${mistakes}<br>
            🏆 Bạn là tài xế giỏi!
          `;
          successModal.classList.add('show');
          setTimeout(() => successModal.classList.remove('show'), 5000);
        }, 800);
      }
    } else {
      mistakes++;
      mistakesEl.textContent = mistakes;
      car.classList.add('wrong');
      setTimeout(() => car.classList.remove('wrong'), 500);
    }
  }

  function startTimer(){
    timerId = setInterval(() => {
      if(startTime === null) return;
      const elapsed = (performance.now() - startTime) / 1000;
      timerEl.textContent = elapsed.toFixed(3);
    }, 50);
  }

  function stopTimer(){
    if(timerId) clearInterval(timerId);
    timerId = null;
  }

  function resetGame(){
    stopTimer();
    startTime = null;
    target = 1;
    mistakes = 0;
    targetEl.textContent = target;
    timerEl.textContent = '0.000';
    mistakesEl.textContent = mistakes;
    successModal.classList.remove('show');
    
    createParkingSpaces();
    setTimeout(createCars, 100); // Small delay to ensure spaces are created
  }

  function shuffleCars(){
    const activeCars = cars.filter(car => !car.classList.contains('parked'));
    const used = [];
    
    activeCars.forEach(car => {
      let x, y, attempts = 0;
      const carWidth = 80, carHeight = 40;
      
      do {
        x = rand(50, window.innerWidth - carWidth - 50);
        y = rand(100, window.innerHeight - 300);
        attempts++;
        
        const collision = used.some(pos => 
          Math.abs(x - pos.x) < carWidth + 20 && 
          Math.abs(y - pos.y) < carHeight + 20
        );
        
        if(!collision) break;
      } while(attempts < 50);
      
      used.push({x, y});
      car.style.left = x + 'px';
      car.style.top = y + 'px';
    });
  }

  // Event listeners
  btnRestart.addEventListener('click', resetGame);
  btnShuffle.addEventListener('click', shuffleCars);

  // Keyboard controls
  document.addEventListener('keydown', e => {
    const k = e.key;
    let pressed = null;
    if(k >= '1' && k <= '9') pressed = Number(k);
    if(k === '0') pressed = 10;
    if(pressed !== null){
      const car = cars.find(c => 
        Number(c.dataset.num) === pressed && 
        !c.classList.contains('parked')
      );
      if(car) car.click();
    }
  });

  // Initialize game
  resetGame();
  
  // Handle window resize
  window.addEventListener('resize', () => {
    setTimeout(shuffleCars, 100);
  });
})();
</script>
</body>
</html>
