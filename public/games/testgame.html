<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Scene + Character</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>

<script type="module">
// ======= IMPORT THREE.js =======
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/controls/OrbitControls.js';

let scene, camera, renderer, clock;
let character, mixer;
let keys = { w:false, s:false, a:false, d:false, space:false };
const speed = 0.2;

init();
animate();

function init() {
  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xa0a0a0);

  // Camera
  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 5, 10);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Controls (debug)
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0,2,0);
  controls.update();

  // Lights
  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  hemiLight.position.set(0, 20, 0);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // Clock
  clock = new THREE.Clock();

  // ===== Load Scene GLB =====
  const loader = new GLTFLoader();
  loader.load('./sea_keep_lonely_watcher.glb', (gltf) => {
    const env = gltf.scene;
    env.traverse((obj) => {
      if(obj.isMesh){
        obj.castShadow = true;
        obj.receiveShadow = true;
      }
    });
    scene.add(env);
  });

  // ===== Load Character GLB =====
  loader.load('./character.glb', (gltf) => {
    character = gltf.scene;
    character.position.set(0,0,0);
    character.scale.set(1,1,1);
    scene.add(character);

    mixer = new THREE.AnimationMixer(character);
    gltf.animations.forEach((clip) => {
      if(clip.name.toLowerCase().includes('idle')){
        mixer.clipAction(clip).play();
      }
    });
  });

  // Keyboard
  window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
  window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

  // Resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if(mixer) mixer.update(delta);

  // Character movement
  if(character){
    if(keys.w) character.position.z -= speed;
    if(keys.s) character.position.z += speed;
    if(keys.a) character.position.x -= speed;
    if(keys.d) character.position.x += speed;
    if(keys.space) character.position.y += speed; // nhảy tạm
  }

  // Camera follow
  if(character){
    camera.position.lerp(
      new THREE.Vector3(character.position.x, character.position.y + 5, character.position.z + 10),
      0.1
    );
    camera.lookAt(character.position);
  }

  renderer.render(scene, camera);
}
</script>

</body>
</html>
